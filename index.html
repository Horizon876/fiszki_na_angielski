<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --hard: #ef4444;
      --med: #f59e0b;
      --easy: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }
    header { text-align: center; margin-bottom: 8px; }
    h1 { font-size: 1.6rem; font-weight: 700; color: #60a5fa; margin-bottom: 6px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid #334155; }
    select, button.reset-btn { background: #334155; color: #fff; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; outline: none; }
    select:focus { border-color: var(--primary); }
    .stats-bar { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); padding: 4px 8px; }
    .progress-container { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; display: flex; }
    .progress-mastered { background: var(--easy); height: 100%; transition: width 0.3s; }
    .progress-learning { background: var(--med); height: 100%; transition: width 0.3s; }
    
    /* Fiszka */
    .flashcard-wrapper { perspective: 1000px; width: 100%; height: 260px; cursor: pointer; }
    .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; border-radius: 16px; border: 1px solid #334155; background: var(--card-bg); }
    .card-back { transform: rotateY(180deg); background: #1a2333; border-color: #3b82f6; }
    .category-badge { position: absolute; top: 14px; font-size: 0.75rem; background: #0f172a; color: #93c5fd; padding: 4px 10px; border-radius: 20px; border: 1px solid #1e3a8a; }
    .card-direction { position: absolute; top: 14px; right: 14px; font-size: 0.75rem; color: var(--text-muted); }
    .card-text { font-size: 1.45rem; font-weight: 600; line-height: 1.4; color: #ffffff; }
    .card-subtext { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); }
    .hint-tap { position: absolute; bottom: 12px; font-size: 0.75rem; color: #64748b; }

    /* Przyciski oceny */
    .action-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; opacity: 0.3; pointer-events: none; transition: opacity 0.2s; }
    .action-buttons.active { opacity: 1; pointer-events: auto; }
    .btn-rating { border: none; border-radius: 10px; padding: 14px 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform 0.1s, filter 0.2s; }
    .btn-rating:active { transform: scale(0.97); }
    .btn-hard { background: var(--hard); }
    .btn-med { background: var(--med); }
    .btn-easy { background: var(--easy); }
    .btn-sub { font-size: 0.7rem; font-weight: 400; opacity: 0.9; }

    .instructions { font-size: 0.75rem; text-align: center; color: #64748b; margin-top: 8px; }
  </style>
</head>

    </div>
  </div>

  <div class="action-buttons" id="actionButtons">

    </button>

    </button>
    <button class="btn-rating btn-easy" id="btnEasy">

  </div>

  <div class="instructions">
    Skróty: <b>Spacja</b> = Obróć | <b>1</b> = Nie wiem | <b>2</b> = Średnio | <b>3</b> = Łatwe
  </div>
</div>

  ["reward /rɪˈwɔːd/ (n)", "nagroda", "Well-being"],
  ["susceptible (to) /səˈseptəbəl/ (adj)", "podatny (na)", "Well-being"],
  ["take a toll (idm)", "tu: odbić się (na zdrowiu)", "Well-being"],
  ["tired /ˈtaɪəd/ (adj)", "zmęczony", "Well-being"],
  ["traditional medicine (phr)", "medycyna tradycyjna/konwencjonalna", "Well-being"]
];

// Stan aplikacji i pamięć (SRS)
let stats = JSON.parse(localStorage.getItem('fiszki_stats_v2') || '{}');
let activeQueue = [];
let currentCard = null;
let isFlipped = false;

// Elementy DOM
const cardWrapper = document.getElementById('cardWrapper');
const flashcard = document.getElementById('flashcard');
const frontText = document.getElementById('frontText');
const backText = document.getElementById('backText');
const frontCategory = document.getElementById('frontCategory');
const backCategory = document.getElementById('backCategory');
const frontDirection = document.getElementById('frontDirection');
const actionButtons = document.getElementById('actionButtons');
const modeSelect = document.getElementById('modeSelect');
const categorySelect = document.getElementById('categorySelect');
const resetBtn = document.getElementById('resetBtn');

// Wypełnij listę kategorii
const categories = [...new Set(VOCAB.map(v => v[2]))];
categories.forEach(cat => {
  const opt = document.createElement('option');
  opt.value = cat;
  opt.textContent = `${cat} (${VOCAB.filter(v => v[2] === cat).length})`;
  categorySelect.appendChild(opt);
});

// Pomocnicza funkcja klucza SRS
function getCardKey(en, dir) {
  return `${en}_${dir}`;
}

// Inicjalizacja kolejki
function initQueue() {
  const selectedCat = categorySelect.value;
  const mode = modeSelect.value;
  let list = VOCAB;

  if (selectedCat !== 'ALL') {
    list = list.filter(item => item[2] === selectedCat);
  }

  activeQueue = [];
  list.forEach(([en, pl, cat]) => {
    if (mode === 'en-pl' || mode === 'mix') {
      activeQueue.push({ en, pl, cat, dir: 'en-pl' });
    }
    if (mode === 'pl-en' || mode === 'mix') {
      activeQueue.push({ en, pl, cat, dir: 'pl-en' });
    }
  });

  // Losowo przetasuj talię na start
  activeQueue.sort(() => Math.random() - 0.5);
  nextCard();
}

function updateProgress() {
  const total = activeQueue.length + (currentCard ? 1 : 0);
  let mastered = 0;
  let learning = 0;

  // Zliczanie na podstawie zapamiętanych wyników
  VOCAB.forEach(([en]) => {
    ['en-pl', 'pl-en'].forEach(d => {
      const score = stats[getCardKey(en, d)] || 0;
      if (score >= 3) mastered++;
      else if (score > 0) learning++;
    });
  });

  const totalPossible = VOCAB.length * 2;
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('statLearning').textContent = learning;
  document.getElementById('statQueue').textContent = activeQueue.length + (currentCard ? 1 : 0);

  document.getElementById('progMastered').style.width = `${(mastered / totalPossible) * 100}%`;
  document.getElementById('progLearning').style.width = `${(learning / totalPossible) * 100}%`;
}

function flipCard() {
  isFlipped = !isFlipped;
  flashcard.classList.toggle('flipped', isFlipped);
  actionButtons.classList.toggle('active', isFlipped);
}

function nextCard() {
  isFlipped = false;
  flashcard.classList.remove('flipped');
  actionButtons.classList.remove('active');

  if (activeQueue.length === 0) {
    currentCard = null;
    frontText.textContent = "🎉 Gratulacje!";
    backText.textContent = "Wszystkie fiszki w tej sesji zostały przejrzane!";
    frontCategory.textContent = "Koniec sesji";
    frontDirection.textContent = "";
    updateProgress();
    return;
  }

  // Wybierz kartę z początku kolejki
  currentCard = activeQueue.shift();

  const isEnToPl = currentCard.dir === 'en-pl';
  frontText.textContent = isEnToPl ? currentCard.en : currentCard.pl;
  backText.textContent = isEnToPl ? currentCard.pl : currentCard.en;
  frontCategory.textContent = currentCard.cat;
  backCategory.textContent = currentCard.cat;
  frontDirection.textContent = isEnToPl ? "🇬🇧 EN ➔ 🇵🇱 PL" : "🇵🇱 PL ➔ 🇬🇧 EN";

  updateProgress();
}

// Obsługa ocen SRS
function rateCard(rating) {
  if (!currentCard || !isFlipped) return;

  const key = getCardKey(currentCard.en, currentCard.dir);
  let score = stats[key] || 0;

  if (rating === 'hard') {
    // Nie wiedziałem -> reset poziomu, wraca BARDZO szybko (np. za 2-3 karty)
    stats[key] = 0;
    const insertPos = Math.min(activeQueue.length, 2 + Math.floor(Math.random() * 2));
    activeQueue.splice(insertPos, 0, currentCard);
  } else if (rating === 'med') {
    // Średnio -> podnieś lekko, powtórz w tej sesji nieco dalej (za 6-10 kart)
    stats[key] = Math.max(1, score + 1);
    const insertPos = Math.min(activeQueue.length, 7 + Math.floor(Math.random() * 4));
    activeQueue.splice(insertPos, 0, currentCard);
  } else if (rating === 'easy') {
    // Łatwe -> opanowane, usuwamy z bieżącej aktywnej kolejki, wraca tylko w nowej sesji
    stats[key] = (score < 3 ? 3 : score + 1);
  }

  localStorage.setItem('fiszki_stats_v2', JSON.stringify(stats));
  nextCard();
}

// Zdarzenia
cardWrapper.addEventListener('click', flipCard);
document.getElementById('btnHard').addEventListener('click', (e) => { e.stopPropagation(); rateCard('hard'); });
document.getElementById('btnMed').addEventListener('click', (e) => { e.stopPropagation(); rateCard('med'); });
document.getElementById('btnEasy').addEventListener('click', (e) => { e.stopPropagation(); rateCard('easy'); });

modeSelect.addEventListener('change', initQueue);
categorySelect.addEventListener('change', initQueue);

resetBtn.addEventListener('click', () => {
  if (confirm("Czy na pewno chcesz zresetować statystyki nauki?")) {
    stats = {};
    localStorage.removeItem('fiszki_stats_v2');
    initQueue();
  }
});

// Skróty klawiszowe
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    flipCard();
  } else if (e.key === '1') {
    rateCard('hard');
  } else if (e.key === '2') {
    rateCard('med');
  } else if (e.key === '3') {
    rateCard('easy');
  }
});

// Start
initQueue();
</script>
</body>
</html>
